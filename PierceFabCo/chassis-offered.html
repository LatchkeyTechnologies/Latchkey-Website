<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chassis Offered | Pierce Fab Co.</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#050505;
    --gold:#b68435;
    --white:#f4efe7;
    --text:#ddd5c8;
}

body{
    background:#050505;
    color:var(--white);
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

/* =========================================
   HEADER
========================================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:28px 48px;

    border-bottom:1px solid rgba(255,255,255,.08);

    background:#050505;
}

.brand{
    font-family:Georgia, serif;
    font-size:56px;
    font-weight:900;

    line-height:.78;
    letter-spacing:2px;
}

.brand span{
    display:block;

    font-family:Arial, sans-serif;
    font-size:24px;

    letter-spacing:6px;

    margin-top:10px;
}

.nav{
    display:flex;
    gap:28px;

    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.nav a{
    color:var(--white);
    text-decoration:none;
    transition:.25s;
}

.nav a:hover{
    color:var(--gold);
}

/* =========================================
   PAGE STAGE
========================================= */

.stage{
    position:relative;

    overflow:hidden;

    min-height:calc(100vh - 170px);

    background:#050505;
}

/* Blueprint */

.stage::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:url("frame-blueprint-sepia.jpg");

    background-size:1400px auto;
    background-position:center center;
    background-repeat:no-repeat;

    opacity:.32;

    filter:
        brightness(1.15)
        contrast(1.08)
        sepia(.55);

    mix-blend-mode:screen;

    z-index:0;

    pointer-events:none;
}

/* Dark Overlay */

.stage::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(5,5,5,.40),
            rgba(5,5,5,.72)
        );

    z-index:1;

    pointer-events:none;
}

/* =========================================
   CONTENT
========================================= */

.main{
    position:relative;
    z-index:2;

    width:100%;
    max-width:1400px;

    margin:0 auto;

    padding:110px 48px 130px;
}

.kicker{
    color:var(--gold);

    text-transform:uppercase;
    letter-spacing:4px;

    font-size:12px;
    font-weight:bold;

    margin-bottom:18px;
}

.hero-title{
    font-size:84px;
    line-height:.88;

    text-transform:uppercase;

    margin-bottom:30px;
}

.gold-line{
    width:60px;
    height:2px;

    background:var(--gold);

    margin-bottom:60px;
}

/* =========================================
   CHASSIS GRID
========================================= */

.chassis-grid{
    display:grid;

    grid-template-columns:repeat(2, minmax(280px, 420px));

    gap:24px;
}

.chassis-link{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:26px 30px;

    text-decoration:none;

    color:var(--white);

    border:1px solid rgba(255,255,255,.10);

    background:rgba(5,5,5,.58);

    backdrop-filter:blur(3px);

    transition:.25s;
}

.chassis-link:hover{
    border-color:rgba(182,132,53,.55);

    background:rgba(12,12,12,.82);

    transform:translateY(-2px);
}

.chassis-link span{
    font-size:28px;
    font-weight:bold;

    letter-spacing:1px;
}

.arrow{
    color:var(--gold);

    font-size:24px;
}

/* =========================================
   FOOTER
========================================= */

.footer{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;

    gap:18px;

    padding:24px 48px;

    border-top:1px solid rgba(255,255,255,.08);

    background:#050505;

    color:#cfc8bd;

    font-size:12px;
    letter-spacing:1px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:900px){

    .header{
        flex-direction:column;
        gap:24px;

        padding:26px 20px;
    }

    .brand{
        text-align:center;
        font-size:46px;
    }

    .nav{
        flex-wrap:wrap;
        justify-content:center;
        gap:18px;
    }

    .main{
        padding:70px 26px 90px;
    }

    .hero-title{
        font-size:54px;
    }

    .chassis-grid{
        grid-template-columns:1fr;
    }

    .footer{
        flex-direction:column;
        text-align:center;

        padding:30px;
    }

    .stage::before{
        background-size:185%;
        background-position:center center;

        opacity:.18;
    }
}

</style>
</head>

<body>

        <h1 class="hero-title">

        <div class="gold-line"></div>

            </a>

            <a class="chassis-link" href="1961-1966.html">

            </a>

            <a class="chassis-link" href="1967-1972.html">

            <a class="chassis-link" href="1975-1979.html">

            <a class="chassis-link" href="1980-1986.html">

            <a class="chassis-link" href="1987-1991.html">

            <a class="chassis-link" href="1992-1996.html">

            </a>

        </div>

    </main>

</section>

<footer class="footer">

    <div>PIERCE FAB CO.</div>

</footer>

</body>
</html>
